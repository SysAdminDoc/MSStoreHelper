[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "msstorehelper"
version = "3.36.0"
description = "GUI tool to download and install Microsoft Store apps without the Store UI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "SysAdminDoc", email = "matt_parker@outlook.com" }
]
dependencies = [
  "customtkinter==5.2.2",
  "requests==2.34.2",
  "beautifulsoup4==4.14.3",
]

[project.scripts]
msstorehelper = "MSStoreHelper:main"

[tool.setuptools]
py-modules = ["MSStoreHelper", "command_runner", "diagnostic_bundle", "http_downloader", "mirror_service", "msstore_package_resolution", "operation_coordinator", "package_ingress", "package_trust", "repair_transaction", "store_sources"]
